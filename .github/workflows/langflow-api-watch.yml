name: Langflow API Watch

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

concurrency:
  group: langflow-api-watch
  cancel-in-progress: false

jobs:
  check:
    name: Check latest Langflow API version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      supported_version: ${{ steps.check.outputs.supported_version }}
      latest_version: ${{ steps.check.outputs.latest_version }}
      has_update: ${{ steps.check.outputs.has_update }}
      issue_title: ${{ steps.check.outputs.issue_title }}
      already_announced: ${{ steps.check.outputs.already_announced }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'

      - name: Check release
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/check-langflow-release.mjs

  notify:
    name: Open upgrade issue and notify
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.has_update == 'true' && needs.check.outputs.already_announced != 'true'
    permissions:
      issues: write
    env:
      SUPPORTED_VERSION: ${{ needs.check.outputs.supported_version }}
      LATEST_VERSION: ${{ needs.check.outputs.latest_version }}
      ISSUE_TITLE: ${{ needs.check.outputs.issue_title }}
    steps:
      - name: Open upgrade issue
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          body=$(cat <<EOF
          The weekly Langflow API watch found Langflow ${LATEST_VERSION}. This package targets ${SUPPORTED_VERSION}.

          - [ ] Compare https://github.com/langflow-ai/langflow/compare/v${SUPPORTED_VERSION}...v${LATEST_VERSION} against the endpoints in src/services/langflow-client.ts
          - [ ] Update the client and contract tests for changed endpoints
          - [ ] Update the README API compatibility section (the watch reads the target version from it)
          - [ ] Run typecheck, tests, build and the package smoke test
          EOF
          )
          url=$(gh issue create --title "${ISSUE_TITLE}" --body "${body}" --label dependencies --label langflow)
          echo "url=${url}" >> "${GITHUB_OUTPUT}"
          echo "Opened ${url}"

      - name: Send SMS alert
        env:
          ISSUE_URL: ${{ steps.issue.outputs.url }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          TWILIO_TO_NUMBER: ${{ secrets.TWILIO_TO_NUMBER }}
        run: |
          missing=0
          for secret_name in TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN TWILIO_FROM_NUMBER TWILIO_TO_NUMBER; do
            if [ -z "${!secret_name}" ]; then
              echo "Missing required secret: ${secret_name}"
              missing=1
            fi
          done

          if [ "${missing}" -ne 0 ]; then
            echo "Skipping SMS alert because Twilio secrets are incomplete."
            exit 0
          fi

          body="langflow-mcp: new Langflow API ${LATEST_VERSION} detected (supported: ${SUPPORTED_VERSION}). Issue: ${ISSUE_URL}"
          curl --fail --silent --show-error \
            -u "${TWILIO_ACCOUNT_SID}:${TWILIO_AUTH_TOKEN}" \
            -X POST "https://api.twilio.com/2010-04-01/Accounts/${TWILIO_ACCOUNT_SID}/Messages.json" \
            --data-urlencode "From=${TWILIO_FROM_NUMBER}" \
            --data-urlencode "To=${TWILIO_TO_NUMBER}" \
            --data-urlencode "Body=${body}"
        continue-on-error: true

      - name: Notify Paperclip webhook
        env:
          ISSUE_URL: ${{ steps.issue.outputs.url }}
          PAPERCLIP_RA_WEBHOOK_URL: ${{ secrets.PAPERCLIP_RA_WEBHOOK_URL }}
        run: |
          if [ -z "${PAPERCLIP_RA_WEBHOOK_URL}" ]; then
            echo "PAPERCLIP_RA_WEBHOOK_URL is not set, skipping Paperclip webhook notification."
            exit 0
          fi

          payload=$(cat <<EOF
          {"source":"langflow-mcp","event":"langflow_api_update_detected","supported_version":"${SUPPORTED_VERSION}","latest_version":"${LATEST_VERSION}","issue_url":"${ISSUE_URL}"}
          EOF
          )
          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            -X POST "${PAPERCLIP_RA_WEBHOOK_URL}" \
            -d "${payload}"
        continue-on-error: true
